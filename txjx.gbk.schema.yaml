# Rime schema settings
# encoding: utf-8

schema:
  schema_id: txjx.gbk
  name: 天行键GBK字集辅助方案·勿选
  version: "2026年9月7日"
  author:
    - ProudCat
    - 浮生 <wzxmer@outlook.com>
  description: |
    仅用于部署 txjx.gbk 词典，供 GBK 反查与单字编码提示使用。

engine:
  processors:
    - key_binder
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
  translators:
    - table_translator
  filters:
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba;`'"
  initials: "abcdefghijklmnopqrstuvwxyz;`'"
  delimiter: " '"
  # txjx.gbk.dict.yaml 当前最长编码 50 位；过小会在 prism 构建时截断长码。
  max_code_length: 50
  # 生成反引号通配索引；主方案使用 table_translator 保留 oek 的 ek 前缀候选。
  algebra:
    - derive/^([a-z])([a-z]*)$/`$2/
    - derive/^([a-z])([a-z])([a-z]*)$/$1`$3/
    - derive/^([a-z])([a-z])([a-z]*)$/``$3/
    - derive/^([a-z])([a-z])([a-z])([a-z]*)$/$1$2`$4/
    - derive/^([a-z])([a-z])([a-z])([a-z])([a-z]*)$/$1$2$3`$5/
    - derive/^([a-z])([a-z])([a-z])([a-z])([a-z])([a-z]*)$/$1$2$3$4$5`$6/
    - derive/^([a-z])([a-z])([a-z])([a-z])([a-z])([a-z])$/$1$2$3$4$5`/

translator:
  dictionary: txjx.gbk
  db_class: tabledb
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false

key_binder:
  import_preset: default
