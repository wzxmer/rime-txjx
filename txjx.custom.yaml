# ==================== TXJX 天行键自定义配置 ====================
# 功能开关一键配置文件
# 修改后需要重新部署 Rime 才能生效

patch:
  # ==================== 新手推荐基础配置 ====================
  schema/name: '天行键'                 # 状态栏显示名称
  speller/auto_select: false           # 关闭自动上屏，避免误提交
  translator/enable_completion: true   # 启用逐码补全候选
  translator/encode_commit_history: true # 启用 i 键历史候选
  menu/page_size: 5                    # 每页显示 5 个候选
  txjx/history_size: 5                 # 保存最近 5 条历史候选
  hint_text: ''                        # 顶功提示符，空值表示不额外显示
  zzc/hint_text: '自造词ing'           # 自造词进行中提示
  zzc/candidate_hint_text: '自造词'     # 自造词候选来源提示

  # ==================== 性能与候选配置 ====================
  txjx_completion/max_scan_candidates: 50      # 每次最多扫描 50 个原始候选
  txjx_completion/max_deferred_candidates: 30  # 单字优先最多暂存 30 个词候选
  reverse_hint/use_pron_map: true               # 优先读取拼音码表，减少逐候选反查
  reverse_hint/pron_map_file: txjx.cx.dict.yaml
  txjx/direct_symbols_fast_leaf: false          # 快符使用正常补全和顶功流程

  # 单按 Shift 切换中英文；Shift+字母可临时输入大写英文
  ascii_composer/switch_key/Shift_L: commit_code
  ascii_composer/switch_key/Shift_R: commit_code
  
  # ==================== 功能开关默认状态 ====================
  # 说明：0=选择第一个状态，1=选择第二个状态。
  # 推荐原则：学习提示开启；可能干扰正常候选或产生意外上屏的功能关闭。
  switches/@0/reset: 0              # 中文
  switches/@1/reset: 0              # 简体
  switches/@2/reset: 1              # 逐码提示开
  switches/@3/reset: 0              # 表情关，保持候选简洁
  switches/@4/reset: 1              # 快符开
  switches/@5/reset: 1              # ; 次选开
  switches/@6/reset: 1              # 计算开
  switches/@7/reset: 0              # 空顶关，避免意外上屏
  switches/@8/reset: 1              # 630 提示开
  switches/@9/reset: 0              # 半角

  # ==================== 流式输入配置 ====================
  # 启用 enable_sentence 后，顶功会自动禁用，;'号只作为分隔符，失去次选和三选功能
  # 如需启用流式输入，请取消以下注释（删除行首 # 和空格）

  # translator/enable_sentence: true    # 启用整句输入（同时自动禁用顶功）
  # translator/enable_user_dict: true   # 启用用户词典（流式输入需要）
